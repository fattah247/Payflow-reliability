# Local Prometheus for `docker compose --profile observability up`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payflow
    metrics_path: /actuator/prometheus
    # The metrics endpoint needs an operator key; this is the local demo key.
    authorization:
      credentials: pf_o_local_ops-ana
    static_configs:
      - targets: ["app:8080", "host.docker.internal:8080"]
