spring:
  application:
    name: Payflow-reliability
  datasource:
    url: ${PAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/payflow_reliability}
    username: ${PAYFLOW_DB_USERNAME:payflow_reliability}
    password: ${PAYFLOW_DB_PASSWORD:payflow_reliability}
  flyway:
    # Portable migrations live in db/migration (SQL) and db.migration (Java backfills);
    # database-specific safeguards (append-only triggers, partial unique indexes) in db/vendor/<vendor>.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    # In-flight requests and scheduled jobs finish before the process exits.
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  shutdown: graceful

logging:
  pattern:
    # Every log line carries the request's correlation id (also returned as X-Request-Id and stored on
    # audit events); Spring adds the trace and span ids, so a request can be followed into provider calls.
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    # Hibernate logs every constraint violation at ERROR, including expected, handled concurrency conflicts.
    # GlobalExceptionHandler already logs those at WARN and anything unexpected at ERROR with a stack trace.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${PAYFLOW_TRACE_SAMPLING:1.0}

payflow:
  security:
    # Operators authenticate with API keys whose SHA-256 is listed here; the keys themselves are never stored.
    # Local defaults (pf_o_local_ops-ana, pf_o_local_ops-budi) exist only for the demo; replace them in any real deployment.
    operators:
      - name: ops-ana
        key-sha256: ${PAYFLOW_OPERATOR_ANA_KEY_SHA256:14b94d5ffd0accf82a7426adb64b93ac943f850816a0358c8407f3521e9c55f7}
      - name: ops-budi
        key-sha256: ${PAYFLOW_OPERATOR_BUDI_KEY_SHA256:ca07262ffd60bdc03424272ee13be4ed59d8614c454b4e74716459d4c175d90d}
  provider:
    # Empty base URL means the provider simulator served by this application.
    base-url: ${PAYFLOW_PROVIDER_BASE_URL:}
    api-key: ${PAYFLOW_PROVIDER_API_KEY:sim_local_provider_key}
    # First secret is current; append the previous one during rotation so in-flight webhooks still verify.
    webhook-secrets: ${PAYFLOW_PROVIDER_WEBHOOK_SECRETS:whsec_local_payflow}
    signature-tolerance: 5m
    connect-timeout: 2s
    read-timeout: 5s
    # Never resend a call first dispatched longer ago than this: the provider may have forgotten its key.
    key-resend-window: 23h
  provider-sim:
    enabled: ${PAYFLOW_PROVIDER_SIM_ENABLED:true}
    api-key: ${PAYFLOW_PROVIDER_API_KEY:sim_local_provider_key}
    webhook-secret: ${PAYFLOW_PROVIDER_SIM_WEBHOOK_SECRET:whsec_local_payflow}
    webhook-url: ${PAYFLOW_PROVIDER_SIM_WEBHOOK_URL:}
    max-delivery-attempts: 8
    delivery-base-backoff: 2s
    delivery-max-backoff: 5m
    fault-delay: 8s
    dispatch-interval: 1s
    # How long the simulated provider remembers idempotency keys (real providers prune them, often after 24 h).
    key-retention: 24h
    # The provider's fee on each payout, deducted before it sends the net (basis points of the gross).
    payout-fee-bps: 30
    payout-value-days: 1
    # While slow, the simulator waits this share of each declared latency (declared values still drive decisions).
    latency-time-scale: 0.05
  # The local stand-in for the bank holding the settlement account (statements in camt.053). Local only.
  bank-sim:
    enabled: ${PAYFLOW_BANK_SIM_ENABLED:true}
    api-key: ${PAYFLOW_BANK_API_KEY:bank_local_statement_key}
  bank:
    # Empty base URL means the bank simulator served by this application.
    base-url: ${PAYFLOW_BANK_BASE_URL:}
    api-key: ${PAYFLOW_BANK_API_KEY:bank_local_statement_key}
    statement-poll-interval: 1m
    # The first statement number expected per account; coverage (which days are complete) counts from here.
    first-statement-sequence: 1
  checkout:
    # The checkout service level, measured inside the payment system: start to confirmed capture.
    confirmation-slo: 10s
    slo-objective: 0.95
    abandonment-window: 15m
  # The device-risk reference policy (ADR 028). Points come from the device's signals (LOW 1, MEDIUM 2, HIGH 3, as the
  # device app weighs them), the amount and what is being bought. With amount and action points at zero it decides
  # exactly like the app's own gate.
  risk:
    step-up-threshold: 2
    block-threshold: 5
    block-on-severe-signal: true
    # IDR amounts from which one more point is added.
    amount-steps: 1000000, 5000000
    action-points:
      PHYSICAL_GOODS: 0
      DIGITAL_GOODS: 1
      STORED_VALUE: 2
    # Shops that send no device evidence (server-to-server) are not penalised by default.
    missing-evidence-points: 0
    confirmation-timeout: 10m
  # Simulated customers for local demos (ADR 027). Every value is a model assumption, not observed behaviour.
  loadgen:
    checkout:
      enabled: ${PAYFLOW_LOADGEN_ENABLED:true}
      customers: 40
      amount-min: 50000
      amount-max: 500000
      patience-min: 2s
      patience-max: 8s
      abandon-probability: 0.5
      max-attempts: 3
      concurrency: 8
      # While slow: customers with less patience than the page leave or reload; those who wait for the page but not
      # for the payment answer press pay again (the retry an idempotency key must absorb).
      slow-checkout-page: 4s
      slow-pay: 7s
  reconciliation:
    # A credit lands its payout only if valued no later than the provider's expected date plus this many days.
    value-date-window-days: 2
    three-way-interval: 5m
  workers:
    enabled: ${PAYFLOW_WORKERS_ENABLED:true}
  outbox:
    poll-interval: 1s
    batch-size: 20
    max-attempts: 8
    lease: 30s
    base-backoff: 2s
    max-backoff: 5m
    blocked-retry: 5m
  sweeper:
    interval: 5m
    initial-delay: 1m
    stuck-after: 15m
    recheck-interval: 15m
    pending-expiry: 24h
    created-expiry: 24h
    batch-size: 50
  ledger:
    invariant-check-interval: 5m
  idempotency:
    retention: 24h
    stale-after: 60s
    cleanup-interval: 1h
  metrics:
    refresh-interval: 30s
